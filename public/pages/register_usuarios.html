<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    
    
    <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>
<body>

    <main class="vh-100 bg-light d-flex align-items-center">
        <div class="container py-5">
            <div class="row justify-content-center">
              
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                    <div class="card shadow-sm border-0" style="border-radius: 16px;">
                        <div class="card-body p-4 p-sm-5">

                            
                            <div class="text-center mb-4">
                                <h1 class="h2 fw-bold text-dark">Crear Cuenta</h1>
                                <p class="text-muted small">Por favor, completa tus datos para registrarte</p>
                            </div>

                            <form action="" method="POST">

                                <!-- Nombre Completo -->
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold text-secondary" for="reg_name">Nombre completo</label>
                                    <input type="text" id="reg_name" name="name" class="form-control form-control-lg fs-6" placeholder="Ej. Juan Pérez" required />
                                </div>

                                <!--  Correo Electrónico -->
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold text-secondary" for="reg_email">Correo electrónico</label>
                                    <input type="email" id="reg_email" name="email" class="form-control form-control-lg fs-6" placeholder="correo@ejemplo.com" required />
                                </div>

                                <!-- Contraseña -->
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold text-secondary" for="reg_password">Contraseña</label>
                                    <input type="password" id="reg_password" name="password" class="form-control form-control-lg fs-6" placeholder="Mínimo 8 caracteres" required />
                                </div>

                                <!-- Confirmar Contraseña -->
                                <div class="mb-4">
                                    <label class="form-label small fw-semibold text-secondary" for="reg_confirm_password">Confirmar contraseña</label>
                                    <input type="password" id="reg_confirm_password" name="confirm_password" class="form-control form-control-lg fs-6" placeholder="Repite tu contraseña" required />
                                </div>

                                <!-- Checkbox de Términos -->
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="reg_terms" name="terms" required />
                                    <label class="form-check-label small text-muted" for="reg_terms">
                                        Acepto los <a href="#!" class="text-decoration-none text-primary">Términos de servicio</a> y políticas.
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg w-100 fs-6 fw-bold py-2">Registrarse</button>

                                <div class="text-center mt-4">
                                    <p class="small text-muted mb-0">¿Ya tienes cuenta? <a href="login.html" class="text-decoration-none fw-bold">Inicia sesión aquí</a></p>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
               

            </div>
        </div>
    </main>

    <!-- Scripts de Bootstrap -->
    <script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
